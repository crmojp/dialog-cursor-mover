[package]
name = "dialog-cursor-mover"
version = "0.1.0"
edition = "2021"
# u32::is_multiple_of (log.rs) が 1.87 以降のため
rust-version = "1.87"
description = "ダイアログのOKボタンへ自動でマウスカーソルを移動させる常駐ユーティリティ"
build = "build.rs"
license = "MIT"
readme = "README.md"

[build-dependencies]
winresource = "0.1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
