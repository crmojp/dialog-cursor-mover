; --- config.ini のコメント -----------------------------------------------
; ここに書いた内容が config.ini のコメント行になります。
cfg.header = DialogCursorMover 設定ファイル (UTF-8)\n編集後はタスクトレイのメニューから「設定を再読み込み」を実行してください。

cfg.language = 表示言語。lang ディレクトリのファイル名と対応します。\n例: language = ja  ->  lang\\ja.ini

cfg.enabled = 監視の有効／無効

cfg.delay_ms = ダイアログ検出からカーソル移動までの遅延 (ミリ秒 / 0-60000)\n0 に近すぎるとボタンの配置が確定する前に動くことがあります。\n200-500 程度を推奨します。

cfg.sound_enabled = 移動時に wav を再生するか

cfg.wav_path = 再生する .wav のフルパス

cfg.standard_dialog_only = true: 標準ダイアログ (ウィンドウクラス #32770) のみを対象にする\nfalse: ポップアップウィンドウ全般も対象にする (誤爆が増えます)

cfg.require_foreground = true: ダイアログが実際に前面に来ている時だけカーソルを移動する

cfg.skip_if_cursor_inside = true: 既にカーソルがボタン上にある場合は移動も再生もしない

cfg.move_once_per_dialog = true: 同じダイアログには一度だけ反応する\n\n設定ダイアログのタブを切り替えると、新しいページの表示イベントが飛ぶため、\n何もしなければ切り替えのたびにカーソルが OK ボタンへ戻ってしまいます。\n記録はウィンドウが閉じられた時点で消えるので、閉じて開き直せば再び反応します。

cfg.ignore_own_process = true: このアプリ自身が出したダイアログを無視する\nfalse(既定) なら自身のバージョン情報などにも反応します。\nいずれの場合も、.wav 選択ダイアログの間は自動的に抑止されます。

cfg.move_animation = true: 瞬間移動ではなく、カーソルを滑らかに動かします。

cfg.move_duration_ms = 走る時間 (ミリ秒 / 0-5000)。0 にすると瞬間移動

cfg.move_wobble = 走行時の左右の揺れ幅 (px / 0-40)。0 で直線的に動く

cfg.cursor_animation = true: 移動中だけカーソル画像をテーマのものに差し替えます。\ntheme\\<名前>\\cursor_right.ani / cursor_left.ani が必要です。\n※ これはデスクトップ全体のカーソル設定を一時的に変更します。

cfg.abort_on_user_move = true: 走行中にユーザーがマウスを動かしたら移動を中断する

cfg.user_move_threshold = ユーザーが操作したとみなすカーソルのずれ幅 (px / 2-500)\n誤検知で移動が中断される場合は大きくしてください

cfg.watch_title_changes = true: ウィンドウのタイトル変化も検出のきっかけにする\n\nエクスプローラの「ファイルの置換またはスキップ」は、コピー進捗ウィンドウが\nそのまま中身を差し替えて現れるため、表示イベントが飛びません。\nタイトル変化を見ることでこうしたダイアログを拾えます。

cfg.watch_focus_changes = true: フォーカス移動も検出のきっかけにする\n\nアプリのウィンドウの内側に描画されるダイアログは新しいウィンドウを\n作らないため、ウィンドウの監視では検出できません。そうしたダイアログが\n開くと既定ボタンにフォーカスが移るので、それを手がかりにします。\n(uia_enabled = true のときのみ有効)

cfg.follow_dialog_default_button = true: ラベルが未登録のボタンでも、ダイアログの既定ボタンなら追従する\n\n既定ボタンと同じ並びに「キャンセル」相当のボタンがあるか、既定ボタンが\nダイアログ下端から 25% の範囲にあれば採用します。これによりウィザードの\n「次へ」や単独の「閉じる」を、ラベル登録なしで拾えます。\n\n注意: ダイアログに似た構成のアプリ画面にも反応することがあります。\n個別に除外するには exclude_processes を使ってください。

cfg.follow_default_in_browser = true: ブラウザの中でも上記の既定ボタン判定を行う\n\nWeb ページは任意の UI を作れるため、「ブロック / キャンセル」のような並びを\nアプリのダイアログと区別できません。既定では false にして、ブラウザ内では\n配置による判定を行わないようにしています。\n(ラベルが OK / はい などに一致する場合は、この設定に関わらず反応します)

cfg.uia_enabled = true: UI Automation を併用し、XAML / WinUI のダイアログにも対応する\n(新しい Windows 標準アプリの保存確認などが該当します)

cfg.uia_dialog_like_only = true: UIA 走査を「ダイアログらしい形」のウィンドウだけに限定する\n(リサイズ不可・最小化/最大化ボタンなし・画面に対して小さい)\nfalse にするとブラウザ等も走査対象になり、非常に重くなります

cfg.uia_max_elements = UIA 走査で調べる要素数の上限 (20-5000)

cfg.log_level = 診断ログ 0=オフ / 1=通常 / 2=詳細 (log.txt に出力)

cfg.skip_file_dialogs = true: ファイル/フォルダー選択ダイアログ (開く・保存・フォルダーの選択) を無視する\nこれらは決定ボタンの ID が IDOK のため、無効にすると反応してしまいます

cfg.skip_progress_dialogs = true: プログレスバーを持つ「処理中」ダイアログを無視する\n(コピー中・展開中の進捗ウィンドウなど)

cfg.exclude_processes = これらの実行ファイルが出したダイアログを無視する\n(カンマ区切り、大文字小文字は区別しません)\n例: exclude_processes = installer.exe, backup.exe

cfg.exclude_titles = タイトルにこれらの文字列を含むダイアログを無視する\n(カンマ区切り、部分一致、大文字小文字は区別しません)\n例: exclude_titles = 印刷, 更新のお知らせ

cfg.extra_button_labels = OK 相当とみなす追加のボタンラベル (カンマ区切り)\n\n既定で認識するのは OK / はい / Yes / 了解 / 続行 / Continue だけです。\nこれ以外のラベルのボタンへカーソルを移動させたい場合はここに追記します。\n\n例) エクスプローラの「ファイルの置換またはスキップ」に反応させる:\n    extra_button_labels = ファイルを置き換える\n\n例) 複数指定する場合はカンマで区切る:\n    extra_button_labels = ファイルを置き換える, Install\n\n「実行」「次へ」のような汎用的な語は、意図しない画面にも一致しがちです。\nウィザードの「次へ」などは follow_dialog_default_button で\n登録なしに拾えるので、まずはそちらを試してください。\n\nニーモニックは自動で除去されるので括弧は不要です。\n「ファイルを置き換える(R)」→「ファイルを置き換える」と書いてください。\n\n正確なラベルが分からないときは、log_level = 2 にしてそのダイアログを\n表示させると、log.txt に見つかったボタン名の一覧が出ます。\n\n注意: ここに書いたラベルのボタンには自動でカーソルが移動します。\n「削除」「上書き」のような取り消せない操作のラベルを登録する際は、\n誤クリックの危険があることを踏まえて判断してください\n(このアプリはカーソルを動かすだけでクリックはしません)。
menu.ripple = 到達地点に同心円を表示する
cfg.ripple_enabled = カーソルの到達地点に、縮んでいく同心円を描きます。
cfg.ripple_size = 同心円の直径 (16-600 px)。
cfg.ripple_duration_ms = 同心円が縮みきるまでの時間 (0-3000 ms)。0 で無効になります。
cfg.ripple_color = 同心円の色を RRGGBB で指定します。
menu.theme = テーマ
menu.theme.default = 既定（テーマなし）
cfg.theme = テーマ名。theme ディレクトリ配下のフォルダ名に対応します。\nテーマには icon.ico、cursor_*.ani、sound.wav を置けます。無いものは\n内蔵アイコンと Windows のカーソル・音にフォールバックします。\n空にすると既定の見た目になります。
