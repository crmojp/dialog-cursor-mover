name: Release

# タグを打つと、配布用の zip を作って Release に添付する。
# 配布物は exe のほかに wav・ani・言語ファイルを含むため、
# 手作業でまとめると入れ忘れが起きやすい。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # Action は可動タグではなくコミット SHA で固定する。
      #
      # このジョブは contents: write を持ち、利用者がダウンロードする zip を作る。
      # @v4 や @stable のような可動する参照のままだと、その参照先が差し替えられた
      # 場合に、そのまま配布物へ混入する。
      #
      # 末尾のコメントはバージョンの控え。Dependabot はこれを見て更新する。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # タグと Cargo.toml のバージョンがずれたまま公開すると、
      # 名前と中身が食い違うリリースができてしまう。先に止める。
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $crate = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' -List).Matches[0].Groups[1].Value
          if ($tag -ne $crate) {
            Write-Error "Tag ($tag) does not match the version in Cargo.toml ($crate)."
            exit 1
          }
          Write-Host "Version matches: $crate"

      - name: Test
        run: cargo test --all

      - name: Build
        run: cargo build --release

      - name: Stage distribution files
        shell: pwsh
        run: |
          $dist = 'dist\DialogCursorMover'
          New-Item -ItemType Directory -Force -Path "$dist\lang" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist\theme" | Out-Null

          Copy-Item 'target\release\dialog-cursor-mover.exe' $dist
          Copy-Item 'lang\*.ini'                             "$dist\lang"
          # サンプルテーマを同梱する（リポジトリの assets\theme → 配布物の theme）
          Copy-Item 'assets\theme\*' "$dist\theme" -Recurse
          Copy-Item 'README.md', 'README_JP.md', 'LICENSE'   $dist

          # 実行に必要なファイルが揃っているか確認してから固める
          $required = @(
            'dialog-cursor-mover.exe',
            'lang\en.ini', 'lang\ja.ini',
            'theme\cat\icon.ico', 'theme\cat\sound.wav', 'theme\cat\cursor_right.ani',
            'README.md', 'README_JP.md', 'LICENSE'
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $dist $_)) }
          if ($missing) {
            Write-Error "Missing from the package: $($missing -join ', ')"
            exit 1
          }

          # ファイル名にバージョンを入れる。複数の版をダウンロードした利用者が
          # 手元で区別できるようにするため（手動実行のときはブランチ名になる）
          $zip = "DialogCursorMover-${{ github.ref_name }}.zip"
          Compress-Archive -Path $dist -DestinationPath $zip
          Write-Host "Packaged $($required.Count) files into $zip"

          # 署名のない exe を配る以上、利用者が「落としたものが本物か」を
          # 確かめる手段を用意しておく。リリース本文に載せる
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $hash"

          "ZIP_NAME=$zip"    | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          body: |
            ### Verifying your download

            `${{ env.ZIP_NAME }}`

            ```
            SHA-256: ${{ env.ZIP_SHA256 }}
            ```

            Check it in PowerShell before running the executable:

            ```powershell
            Get-FileHash .\${{ env.ZIP_NAME }} -Algorithm SHA256
            ```

            ### First run

            The executable is not code-signed, so Windows SmartScreen will warn you
            the first time you run it. Choose **More info → Run anyway** once the hash
            above matches. Some antivirus products may flag it too: the program
            installs system-wide WinEvent hooks and calls `SetCursorPos`, which is how
            it does its job — and is also what input-manipulating malware does.

            It never clicks, never sends input to other windows, makes no network
            connections, and collects no telemetry. The README describes exactly what
            it does and does not do.

            ---
